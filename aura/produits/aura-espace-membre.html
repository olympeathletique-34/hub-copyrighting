<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA — Espace Membre</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Jost:wght@200;300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F2; --bg2:#EFECE8; --bg3:#E8E4DE;
  --ink:#0E0C14; --ink2:#2A2635; --ink3:#4A4758;
  --violet:#2D1B69; --vm:#4A2E9E; --vl:#7B5EA7; --vp:#EDE8F8;
  --gold:#B8902A; --gl:#D4AA42; --gbg:#FBF6EC;
  --gray:#8A8798; --border:#E0DDD8;
  --deep:#09071A;
  --green:#1A7A4A; --red:#8B2020;
  --l1-c:#4A2E9E; --l2-c:#1A6B5C; --l3-c:#8B3A1A;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;font-size:16px;line-height:1.8;}

/* ══ LAYOUT ══ */
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
@media(max-width:900px){.app{grid-template-columns:1fr;}}

/* ══ SIDEBAR ══ */
.sidebar{
  background:var(--deep);
  position:fixed;top:0;left:0;bottom:0;width:300px;
  overflow-y:auto;z-index:50;
  display:flex;flex-direction:column;
  border-right:1px solid rgba(201,168,75,0.1);
}
@media(max-width:900px){
  .sidebar{position:fixed;left:-300px;transition:left .3s;z-index:200;}
  .sidebar.open{left:0;}
  .main{margin-left:0!important;}
}
.sb-header{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.06);}
.sb-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.1em;color:#F7F4F0;}
.sb-sub{font-size:10px;font-weight:300;letter-spacing:.35em;color:rgba(201,168,75,.5);text-transform:uppercase;margin-top:2px;}

/* Progress bar global */
.sb-progress{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.06);}
.spb-label{font-size:10px;font-weight:400;letter-spacing:.3em;color:rgba(247,244,240,.3);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;}
.spb-bar{height:3px;background:rgba(255,255,255,.08);}
.spb-fill{height:100%;background:var(--gold);transition:width .5s ease;}

/* Module list */
.sb-modules{flex:1;overflow-y:auto;padding:12px 0;}
.sb-book{margin-bottom:4px;}
.sb-book-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;cursor:pointer;
  font-size:10px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;
  color:rgba(247,244,240,.4);transition:color .2s;
  border:none;background:transparent;width:100%;text-align:left;
}
.sb-book-header:hover{color:rgba(247,244,240,.7);}
.sb-book-header.active{color:var(--gold);}
.sb-book-dot{width:8px;height:8px;border-radius:50%;border:1px solid currentColor;flex-shrink:0;}
.sb-book-arrow{margin-left:auto;font-size:10px;transition:transform .2s;}
.sb-book-header.open .sb-book-arrow{transform:rotate(90deg);}
.sb-lessons{display:none;padding:4px 0;}
.sb-lessons.open{display:block;}
.sb-lesson{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 20px 9px 38px;cursor:pointer;
  font-size:13px;font-weight:300;color:rgba(247,244,240,.45);
  transition:all .15s;border:none;background:transparent;width:100%;text-align:left;
  line-height:1.4;
}
.sb-lesson:hover{color:rgba(247,244,240,.8);background:rgba(255,255,255,.03);}
.sb-lesson.active{color:#F7F4F0;background:rgba(255,255,255,.06);}
.sb-lesson.done{color:rgba(247,244,240,.5);}
.sl-icon{font-size:12px;flex-shrink:0;margin-top:1px;}
.sl-text{flex:1;}

/* ══ MAIN ══ */
.main{margin-left:300px;min-height:100vh;background:var(--bg);}
@media(max-width:900px){.main{margin-left:0;}}

/* Top bar */
.topbar{
  background:#fff;border-bottom:1px solid var(--border);
  padding:0 32px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:40;
}
.tb-menu{display:none;background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--ink);}
@media(max-width:900px){.tb-menu{display:block;}}
.tb-breadcrumb{font-size:12px;font-weight:300;color:var(--gray);letter-spacing:.08em;}
.tb-breadcrumb strong{color:var(--ink2);font-weight:500;}
.tb-progress{display:flex;align-items:center;gap:10px;}
.tb-pct{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--violet);}
.tb-plbl{font-size:10px;font-weight:300;color:var(--gray);letter-spacing:.2em;text-transform:uppercase;}

/* ══ CONTENT ══ */
.content{max-width:780px;margin:0 auto;padding:56px 32px 100px;}
@media(max-width:600px){.content{padding:40px 20px 80px;}}

/* Lesson header */
.lesson-header{margin-bottom:48px;}
.lh-book{
  font-size:10px;font-weight:500;letter-spacing:.45em;
  text-transform:uppercase;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;
}
.lh-book::before{content:'';width:24px;height:1px;background:currentColor;opacity:.5;}
.lh-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(28px,4vw,46px);font-weight:900;
  color:var(--ink);line-height:1.15;margin-bottom:14px;
}
.lh-title em{font-style:italic;color:var(--violet);}
.lh-meta{display:flex;gap:20px;flex-wrap:wrap;}
.lh-tag{
  font-size:10px;font-weight:400;letter-spacing:.3em;
  text-transform:uppercase;padding:5px 14px;
  border:1px solid var(--border);color:var(--gray);
}

/* Concept block */
.concept-section{margin-bottom:44px;}
.cs-eye{
  font-size:10px;font-weight:500;letter-spacing:.45em;
  color:var(--violet);text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;
}
.cs-eye::before{content:'';width:20px;height:1px;background:var(--violet);opacity:.5;}
.cs-h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(20px,2.5vw,28px);font-weight:700;
  color:var(--ink);margin-bottom:20px;line-height:1.2;
}
p.body{font-size:16px;font-weight:300;color:var(--ink3);line-height:1.9;margin-bottom:20px;}
p.body strong{color:var(--ink);font-weight:500;}
p.body em{color:var(--violet);font-style:italic;}

/* Key insight */
.insight{
  background:var(--vp);border-left:3px solid var(--violet);
  padding:24px 28px;margin:28px 0;
}
.insight-lbl{font-size:9px;font-weight:500;letter-spacing:.4em;color:var(--violet);text-transform:uppercase;margin-bottom:8px;}
.insight p{font-family:'Playfair Display',serif;font-size:17px;font-style:italic;color:var(--violet);line-height:1.65;margin:0;}

/* Exercise */
.exercise{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--gold);padding:28px 32px;margin:28px 0;}
.ex-lbl{font-size:9px;font-weight:500;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.ex-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:14px;}
.ex-body{font-size:15px;font-weight:300;color:var(--ink3);line-height:1.8;}
.ex-body p{margin-bottom:12px;}
.ex-body p:last-child{margin-bottom:0;}

/* Journal input */
.journal-wrap{margin:28px 0;}
.journal-lbl{font-size:10px;font-weight:500;letter-spacing:.35em;color:var(--gray);text-transform:uppercase;margin-bottom:10px;}
.journal-ta{
  width:100%;min-height:120px;
  background:#fff;border:1px solid var(--border);
  padding:16px;font-family:'Playfair Display',serif;
  font-size:15px;font-style:italic;color:var(--ink2);
  line-height:1.7;resize:vertical;
  transition:border-color .15s;
}
.journal-ta:focus{outline:none;border-color:var(--violet);}

/* ══ QUIZ ══ */
.quiz-section{
  background:#fff;border:1px solid var(--border);
  padding:36px;margin-top:44px;
}
.quiz-header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.quiz-lbl{font-size:10px;font-weight:500;letter-spacing:.45em;color:var(--violet);text-transform:uppercase;margin-bottom:8px;}
.quiz-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--ink);}
.quiz-sub{font-size:14px;font-weight:300;color:var(--gray);margin-top:6px;}

/* Quiz loading */
.quiz-loading{text-align:center;padding:40px 0;}
.ql-dots{display:inline-flex;gap:6px;margin-bottom:12px;}
.ql-dot{width:7px;height:7px;border-radius:50%;background:var(--violet);opacity:.3;animation:qlpulse .8s ease-in-out infinite;}
.ql-dot:nth-child(2){animation-delay:.15s;}
.ql-dot:nth-child(3){animation-delay:.3s;}
@keyframes qlpulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.ql-text{font-size:14px;font-weight:300;color:var(--gray);font-style:italic;}

/* Quiz question */
.quiz-q-num{font-size:10px;font-weight:500;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
.quiz-q-text{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:24px;}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-opt{
  background:var(--bg2);border:1px solid var(--border);
  padding:14px 18px;cursor:pointer;
  display:flex;align-items:flex-start;gap:12px;
  font-family:'Jost',sans-serif;width:100%;text-align:left;
  transition:all .15s;
}
.quiz-opt:hover{border-color:var(--vl);background:var(--vp);}
.quiz-opt.selected{border-color:var(--violet);background:var(--vp);}
.quiz-opt.correct{border-color:var(--green);background:rgba(26,122,74,0.06);}
.quiz-opt.wrong{border-color:var(--red);background:rgba(139,32,32,0.05);}
.qo-letter{
  width:26px;height:26px;border:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:500;color:var(--gray);transition:all .15s;
}
.quiz-opt.selected .qo-letter{background:var(--violet);color:#fff;border-color:var(--violet);}
.quiz-opt.correct .qo-letter{background:var(--green);color:#fff;border-color:var(--green);}
.quiz-opt.wrong .qo-letter{background:var(--red);color:#fff;border-color:var(--red);}
.qo-text{font-size:14px;font-weight:300;color:var(--ink2);line-height:1.5;padding-top:3px;}

/* Feedback */
.quiz-feedback{
  margin-top:20px;padding:16px 20px;
  font-size:14px;font-weight:300;line-height:1.7;
  display:none;
}
.quiz-feedback.show{display:block;}
.quiz-feedback.ok{background:rgba(26,122,74,0.06);border-left:3px solid var(--green);color:#1A4A2A;}
.quiz-feedback.ko{background:rgba(139,32,32,0.05);border-left:3px solid var(--red);color:#4A1010;}

/* Quiz navigation */
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:12px;}
.quiz-dots{display:flex;gap:6px;}
.qdot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .2s;}
.qdot.done{background:var(--green);}
.qdot.current{background:var(--violet);}

/* Result */
.quiz-result{text-align:center;padding:36px 0 24px;}
.qr-score{font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:1;margin-bottom:8px;}
.qr-label{font-size:12px;font-weight:300;letter-spacing:.2em;color:var(--gray);text-transform:uppercase;margin-bottom:24px;}
.qr-msg{font-family:'Playfair Display',serif;font-size:18px;font-style:italic;color:var(--ink2);line-height:1.65;max-width:480px;margin:0 auto 32px;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Jost',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;
  padding:14px 32px;border:none;cursor:pointer;transition:all .2s;
}
.btn-primary{background:var(--violet);color:#fff;}
.btn-primary:hover{background:var(--vm);transform:translateY(-1px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:var(--gl);}
.btn-outline{background:transparent;color:var(--violet);border:1px solid var(--violet);}
.btn-outline:hover{background:var(--vp);}
.btn-ghost{background:transparent;color:var(--gray);font-size:11px;padding:10px 0;}
.btn-ghost:hover{color:var(--ink);}

/* Completion banner */
.completion{
  background:linear-gradient(135deg,var(--violet),#1A0F3D);
  padding:36px;margin-top:44px;text-align:center;
  display:none;
}
.completion.show{display:block;}
.comp-icon{font-size:32px;margin-bottom:12px;}
.comp-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:#fff;margin-bottom:8px;}
.comp-sub{font-size:14px;font-weight:300;color:rgba(247,244,240,.65);line-height:1.7;margin-bottom:24px;}

/* Welcome screen */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 60px);text-align:center;padding:40px 24px;}
.w-icon{font-size:48px;margin-bottom:24px;}
.w-title{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,48px);font-weight:900;color:var(--ink);margin-bottom:16px;line-height:1.1;}
.w-title em{font-style:italic;color:var(--violet);}
.w-sub{font-size:17px;font-weight:300;color:var(--gray);line-height:1.8;max-width:480px;margin:0 auto 36px;}
.w-stats{display:flex;justify-content:center;gap:36px;margin-bottom:40px;flex-wrap:wrap;}
.ws-item{text-align:center;}
.ws-num{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--violet);line-height:1;}
.ws-lbl{font-size:10px;font-weight:300;letter-spacing:.25em;color:var(--gray);text-transform:uppercase;margin-top:4px;}

/* Overlay mobile */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}
@media(max-width:900px){.overlay.show{display:block;}}
</style>
</head>
<body>

<div class="app">

<!-- ══ SIDEBAR ══ -->
<div class="sidebar" id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">AURA</div>
    <div class="sb-sub">Espace Membre</div>
  </div>
  <div class="sb-progress">
    <div class="spb-label">
      <span>Progression globale</span>
      <span id="sb-pct-lbl">0%</span>
    </div>
    <div class="spb-bar"><div class="spb-fill" id="sb-fill" style="width:0%"></div></div>
  </div>
  <div class="sb-modules" id="sb-modules"></div>
</div>

<!-- OVERLAY mobile -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ══ MAIN ══ -->
<div class="main" id="main-area">
  <div class="topbar">
    <button class="tb-menu" onclick="toggleSidebar()">☰</button>
    <div class="tb-breadcrumb" id="tb-bc">Bienvenue</div>
    <div class="tb-progress">
      <div class="tb-pct" id="tb-pct">0%</div>
      <div class="tb-plbl">complété</div>
    </div>
  </div>

  <div id="page-content">
    <!-- Welcome screen -->
    <div class="welcome">
      <div class="w-icon">◈</div>
      <h1 class="w-title">Bienvenue dans<br>ton <em>espace de transformation</em></h1>
      <p class="w-sub">Chaque notion s'apprend à ton rythme. Chaque étape se valide avant de passer à la suivante. Le programme s'ouvre devant toi, un concept à la fois.</p>
      <div class="w-stats">
        <div class="ws-item"><div class="ws-num">30</div><div class="ws-lbl">Notions</div></div>
        <div class="ws-item"><div class="ws-num">3</div><div class="ws-lbl">Programmes</div></div>
        <div class="ws-item"><div class="ws-num">30</div><div class="ws-lbl">Quiz IA</div></div>
      </div>
      <button class="btn btn-primary" onclick="loadLesson(0,0)">Commencer le programme →</button>
    </div>
  </div>
</div>

</div>

<script>
// ═══════════════════════════════════════════════
// CURRICULUM — 30 leçons, 3 livres, 10 leçons chaque
// ═══════════════════════════════════════════════
const CURRICULUM = [
  {
    id:'l1', title:'AURA Level 1', subtitle:'Le Code du Magnétisme',
    color:'#4A2E9E', colorName:'l1-c',
    lessons:[
      {
        id:'l1-1', title:'Qu\'est-ce que l\'Aura vraiment ?',
        tag:'Fondation',
        concept:`L'aura n'est pas un phénomène mystique. C'est l'ensemble des signaux conscients et inconscients que tu émets en permanence — et qui construisent dans l'esprit des autres une perception de toi avant même que tu aies ouvert la bouche.

Le cerveau humain est câblé pour former des impressions globales à partir d'indices fragmentaires. C'est ce qu'on appelle le **halo effect** : posture, regard, voix, rythme — tout se traite en quelques secondes. Et cette impression, une fois formée, est extraordinairement difficile à inverser.

Ce que la plupart des gens ne comprennent pas : l'aura n'est pas superficielle. Elle est le *reflet externe de ton monde intérieur*. Un homme qui se respecte profondément le montre dans sa façon de marcher. Quelqu'un qui connaît sa valeur le montre dans sa façon de parler — ou de se taire.`,
        insight:`L'aura n'est pas ce que tu montres. C'est ce que tu ne peux pas cacher.`,
        exercise:{
          title:'Le Miroir sans jugement',
          body:`Pendant 3 minutes, regarde-toi dans un miroir sans te juger. Observe simplement ta posture naturelle, ton regard par défaut, ta position de repos. Ne corrige rien.

Pose-toi une seule question : <em>"Ce que je vois ici — est-ce que ça correspond à ce que je ressens à l'intérieur ?"</em>

Si la réponse est non, c'est ton point de départ.`
        },
        journal:'Qu\'as-tu observé dans ton miroir ? Quel décalage as-tu noté entre ton apparence et ce que tu ressens intérieurement ?',
        quizContext:'L\'aura est définie comme l\'ensemble des signaux émis par une personne, perçus par les autres via le halo effect. Elle reflète l\'état intérieur réel, pas une performance. Elle ne se construit pas — elle se révèle en retirant ce qui la cache.'
      },
      {
        id:'l1-2', title:'Le Socle Intérieur',
        tag:'Pilier 1',
        concept:`Tout commence ici. Avant le corps, avant la voix, avant les techniques sociales — il y a ce que tu penses de toi quand tu es seul avec toi-même.

La confiance en soi authentique n'est pas l'absence de doutes. C'est la capacité à agir malgré eux. C'est savoir, profondément, que tu es capable de traverser ce qui se présente.

Les personnes à haute aura ne cherchent pas l'approbation. **Non par arrogance, mais par complétude.** Elles n'ont pas besoin que tu leur confirmes leur valeur parce qu'elles la connaissent déjà. Et c'est précisément ce manque de besoin qui les rend irrésistiblement attirantes.

L'exercice fondamental est celui de *l'identité intentionnelle* : décider consciemment qui tu es, ce que tu défends, ce que tu refuses — et te tenir à cette définition même sous pression sociale.`,
        insight:`Cesse de vouloir être apprécié. Commence à être toi-même pleinement. L'appréciation suivra — chez les gens qui comptent.`,
        exercise:{
          title:'L\'Audit d\'identité',
          body:`Prends 20 minutes et une feuille blanche. Écris en haut : <em>"Qui suis-je quand personne ne regarde ?"</em>

Liste 10 comportements, habitudes ou pensées récurrentes. Pour chacun, demande-toi : est-ce que ça renforce ou affaiblit la personne que je veux être ?

Raye ceux qui affaiblissent. Entoure ceux qui renforcent. Commence à amplifier les seconds.`
        },
        journal:'Quels comportements as-tu identifiés qui trahissent ta version idéale ? Lequel vas-tu travailler en premier ?',
        quizContext:'Le socle intérieur est le premier pilier de l\'aura. La confiance authentique vient de la capacité à agir malgré les doutes — pas de l\'absence de doutes. L\'identité intentionnelle consiste à décider consciemment qui on est et à tenir cette définition sous pression sociale. Le besoin d\'approbation affaiblit le socle.'
      },
      {
        id:'l1-3', title:'Le Signal Physique',
        tag:'Pilier 2',
        concept:`Ton corps ne ment pas. Il traduit en signaux visibles et sonores l'état de ton monde intérieur — et il influence en retour ce même monde intérieur. C'est une boucle que tu peux activer dans les deux sens.

Amy Cuddy à Harvard a démontré que des **postures de puissance** adoptées pendant seulement 2 minutes modifient les niveaux de cortisol et de testostérone. Le corps ne sait pas faire semblant — mais il peut être rééduqué.

Les athlètes de haut niveau le savent intuitivement. Regarde Djokovic avant un service décisif. Étudie Ronaldo à la sortie du tunnel. *Ces corps parlent avant que les scores ne le fassent.*

**Les 4 leviers fondamentaux du signal physique :**

— La posture verticale : tête haute, épaules basses et ouvertes, enracinement sans rigidité
— Le regard direct : ni fuyant, ni fixé. Le contact visuel transmet la présence
— La voix grave et lente : parler lentement est une manifestation de confiance
— Les gestes économes : les mouvements parasites signalent l'inconfort`,
        insight:`Kobe Bryant ne marchait pas vers le terrain. Il en prenait possession. Cette distinction est tout.`,
        exercise:{
          title:'Le Reset Physique — 5 minutes le matin',

— La question qui va plus loin ("qu'est-ce qui compte vraiment pour toi là-dedans ?")
— Le mémo de reconnaissance : identifier chaque semaine une qualité spécifique chez quelqu'un et la lui dire

**Pour la Signature II (Tenir ses positions) :**
— La position avant le groupe : formuler son opinion par écrit avant une réunion, avant d'entendre les autres
— Le désaccord respectueux : "Je comprends ton point de vue. Je maintiens ma position."
— La pression simulée : demander à un ami de challenge ton opinion par pression sociale, pas par argument

**Pour la Signature III (Rester identique) :**
— L'audit des masques : 3 colonnes (professionnel, social, intime) — ce qui change selon le contexte
— Le test du comportement privé : "Ai-je agi aujourd'hui comme si quelqu'un que j'admire m'observait en permanence ?"
— La phrase-ancre vocale : formuler à voix haute chaque matin qui tu es, indépendamment du contexte`,
        insight:`La constance est contagieuse. Quand les gens réalisent que tu n'as pas de version, leur façon de te regarder change.`,
        exercise:{
          title:'L\'Audit des Masques',
          body:`Prends une feuille. Trois colonnes : professionnel, social, intime.

Liste les comportements, opinions et attitudes que tu **modifies** selon le contexte.

Ce mapping révèle où tu portes des masques. Chaque masque est une dépense d'énergie et une fuite dans ton champ de présence.

L'objectif n'est pas tout révéler à tout le monde — c'est de ne plus avoir à jouer un rôle différent selon qui te regarde.`
        },
        journal:'Quels masques as-tu identifiés dans l\'audit ? Lequel coûte le plus d\'énergie à maintenir ? Que se passerait-il si tu l\'enlevais ?',
        quizContext:'Les exercices des 3 signatures : Signature I (écoute totale, question de profondeur, mémo de reconnaissance), Signature II (position avant le groupe, désaccord respectueux, pression simulée), Signature III (audit des masques 3 colonnes, test du comportement privé, phrase-ancre vocale). Les masques coûtent de l\'énergie et créent des fuites dans le champ de présence.'
      },
      {
        id:'l3-8', title:'Le Leadership dans le Quotidien',
        tag:'Application',
        concept:`Le leadership naturel ne se manifeste pas seulement dans les grands moments — il se construit dans les micro-moments du quotidien.

**Au travail :**
— La réunion difficile où tu gardes le rythme lent quand les autres s'emballent
— L'opinion que tu exposes même si tu es seul à la défendre
— La décision que tu prends sans avoir besoin d'un consensus préalable

**Dans les relations :**
— La conversation où tu écoutes vraiment plutôt que d'attendre ton tour
— Le silence que tu laisses exister sans l'inconfort de le remplir
— La limite que tu poses clairement, sans s'excuser ni surexposer

**Dans le sport :**
— Le moment de pression où tu ralentis ta respiration quand les autres accélèrent
— La défaite que tu vis debout, sans chercher des excuses
— L'effort que tu fais seul, quand personne ne regarde

Chaque micro-moment est une vote. Un vote pour ou contre la personne que tu construis. Les votes s'accumulent. Et après assez de votes dans la même direction, l'identité devient évidente — pour toi, et pour les autres.`,
        insight:`Tu ne construis pas ton leadership dans les moments d'exposition. Tu le révèles dans les moments ordinaires.`,
        exercise:{
          title:'Le Journal des Micro-Moments',
          body:`Pendant 7 jours, identifie chaque soir un micro-moment de ta journée où tu as exercé — ou raté — un leadership naturel.

Pas de grand événement requis. Une conversation, une décision, une réaction sous pression.

Décris le moment, ce que tu as fait ou n'as pas fait, et ce que tu ferais différemment.`
        },
        journal:'Quel micro-moment de cette semaine t\'a appris quelque chose sur ton leadership naturel ? Décris-le avec précision.',
        quizContext:'Le leadership naturel se manifeste dans les micro-moments : réunion difficile, opinion défendue seul, conversation authentique, limite posée, défaite vécue debout, effort invisible. Chaque micro-moment est un vote pour ou contre l\'identité qu\'on construit. L\'accumulation de votes dans la même direction crée une identité évidente. Le leadership se révèle dans l\'ordinaire, pas seulement dans l\'exceptionnel.'
      },
      {
        id:'l3-9', title:'Le Stack Intégré — 90 Jours Avancés',
        tag:'Protocole Final',
        concept:`Tu as maintenant tous les éléments. Ce stack final intègre les 3 programmes en un protocole quotidien soutenable — pas une liste de 50 pratiques, mais les 5 à 7 qui ont le plus d'impact.

**Matin (25-30 min) :**
→ 5 min Quick Coherence (Level 2)
→ 10 min silence actif (Level 2)
→ 5 min journaling autonome : une opinion, une intention, une question de croissance (Level 1 + 2)
→ Reset physique 5 min (Level 1)

**Journée :**
→ Décalage de rythme systématique (Manifeste)
→ Pause de 3 secondes avant chaque réponse (Manifeste + Level 2)
→ Une séance TFT hebdomadaire sur la peur la plus présente (Level 2)

**Soir (10 min) :**
→ Bilan de cohérence : où ai-je cherché l'approbation ? où suis-je resté ancré ? (Manifeste)
→ Journal des micro-moments de leadership (Manifeste)

**Mensuel :**
→ Jeûne informationnel 48h (Level 2)
→ Travail transgénérationnel : un pattern identifié et travaillé (Level 2)
→ Relecture du quiz de positionnement pour mesurer la progression`,
        insight:`Le meilleur programme est celui qu'on tient. Pas celui qui est le plus complet.`,
        exercise:{
          title:'Installer le Stack — Semaine 1',
          body:`Commence par le minimum viable :

**Matin :** Quick Coherence (5 min) + une intention écrite (2 min)
**Soir :** une question : "Ai-je cherché l'approbation aujourd'hui ? Où ?"

Une semaine. Tous les jours. Même le week-end.

Ajoute un élément par semaine. En 4 semaines, le stack complet sera en place.`
        },
        journal:'Après avoir tenu le stack pendant une semaine, qu\'est-ce qui a le plus changé dans ton état général ? Dans tes interactions ?',
        quizContext:'Le stack intégré combine les 3 programmes en 5-7 pratiques quotidiennes essentielles. Matin : Quick Coherence + silence + journaling autonome + reset physique. Journée : décalage de rythme, pause 3 secondes, TFT hebdomadaire. Soir : bilan de cohérence + journal des micro-moments. Mensuel : jeûne informationnel + travail transgénérationnel. Le principe : le meilleur programme est celui qu\'on tient.'
      },
      {
        id:'l3-10', title:'Tu es arrivé',
        tag:'Conclusion',
        concept:`Tu as parcouru les 30 notions de ce programme. Ce n'est pas une fin — c'est un nouveau point de départ.

Voici ce que tu as intégré :

**Level 1 — Les fondations :**
L'aura comme reflet de l'état intérieur. Les 4 piliers opérationnels. Le plan 90 jours.

**Level 2 — La profondeur :**
La déconnexion du champ collectif. TFT pour dissoudre les peurs sociales. Pensée autonome. Charisme quantique. Libération des mémoires transgénérationnelles. Silence comme technologie. Communication depuis la plénitude.

**Manifeste — La conséquence :**
Le paradoxe du leadership. Cohérence interne. Voix comme champ de force. Calme sous pression. Vision qui oriente. Les 3 signatures du leader silencieux.

**Ce qui vient ensuite :**
Continue le stack quotidien. Refais le quiz de niveau dans 30 jours. Identifie le prochain chantier. Transmets ce que tu as appris — c'est la forme la plus puissante d'intégration.

L'aura ne se maintient pas — elle grandit ou elle rétrécit. Ce que tu fais demain matin, avant que le monde commence ses demandes, est la seule chose qui compte.`,
        insight:`Tu n'es plus quelqu'un qui cherche son aura. Tu es quelqu'un qui la laisse exister — et qui sait maintenant comment y revenir quand elle s'éloigne.`,
        exercise:{
          title:'La Lettre Finale',
          body:`Écris une lettre à ton moi du premier jour de ce programme.

Qu'est-ce que tu lui dirais ?
Qu'est-ce qui a vraiment changé ?
Qu'est-ce que tu ne savais pas encore et que tu sais maintenant ?

Cette lettre est pour toi. Et peut-être, un jour, pour quelqu'un qui commencera là où tu as commencé.`
        },
        journal:'Écris ta lettre au toi du premier jour. Prends le temps qu\'il faut.',
        quizContext:'La conclusion intègre les 3 programmes : Level 1 (fondations, 4 piliers, plan 90j), Level 2 (champ collectif, TFT, pensée autonome, charisme, transgénérationnel, silence, communication), Manifeste (6 lois, 3 signatures). Le travail continue via le stack quotidien, le quiz mensuel et la transmission. L\'aura grandit ou rétrécit — le travail du matin en est la cause principale.'
      }
    ]
  }
];

// ═══════════════════════════
// STATE (localStorage)
// ═══════════════════════════
function getState(){
  try{return JSON.parse(localStorage.getItem('aura_state'))||{completed:{},current:{b:0,l:0}};}
  catch(e){return{completed:{},current:{b:0,l:0}};}
}
function setState(s){try{localStorage.setItem('aura_state',JSON.stringify(s));}catch(e){}}

let STATE=getState();
let QUIZ_DATA=null;
let QUIZ_ANSWERS=[];
let QUIZ_SHOWN=0;

// ═══════════════════════════
// INIT
// ═══════════════════════════
function totalLessons(){return CURRICULUM.reduce((a,b)=>a+b.lessons.length,0);}
function doneCount(){return Object.keys(STATE.completed).length;}

function globalPct(){return Math.round((doneCount()/totalLessons())*100);}

function buildSidebar(){
  const wrap=document.getElementById('sb-modules');
  wrap.innerHTML='';
  CURRICULUM.forEach((book,bi)=>{
    const bookDiv=document.createElement('div');
    bookDiv.className='sb-book';
    const isOpenBook=STATE.current.b===bi;
    const hdr=document.createElement('button');
    hdr.className='sb-book-header'+(isOpenBook?' active open':'');
    hdr.innerHTML=`<span class="sb-book-dot"></span><span style="flex:1;text-align:left;">${book.title}</span><span class="sb-book-arrow">›</span>`;
    hdr.onclick=()=>{
      const lessons=bookDiv.querySelector('.sb-lessons');
      const isOpen=lessons.classList.contains('open');
      document.querySelectorAll('.sb-lessons').forEach(l=>l.classList.remove('open'));
      document.querySelectorAll('.sb-book-header').forEach(h=>h.classList.remove('open'));
      if(!isOpen){lessons.classList.add('open');hdr.classList.add('open');}
    };
    const lessonsDiv=document.createElement('div');
    lessonsDiv.className='sb-lessons'+(isOpenBook?' open':'');
    book.lessons.forEach((lesson,li)=>{
      const isDone=STATE.completed[lesson.id];
      const isCurrent=STATE.current.b===bi&&STATE.current.l===li;
      const btn=document.createElement('button');
      btn.className='sb-lesson'+(isCurrent?' active':'')+(isDone?' done':'');
      btn.innerHTML=`<span class="sl-icon">${isDone?'✓':isCurrent?'▶':'○'}</span><span class="sl-text">${lesson.title}</span>`;
      btn.onclick=()=>loadLesson(bi,li);
      lessonsDiv.appendChild(btn);
    });
    bookDiv.appendChild(hdr);
    bookDiv.appendChild(lessonsDiv);
    wrap.appendChild(bookDiv);
  });
  const pct=globalPct();
  document.getElementById('sb-fill').style.width=pct+'%';
  document.getElementById('sb-pct-lbl').textContent=pct+'%';
  document.getElementById('tb-pct').textContent=pct+'%';
}

// ═══════════════════════════
// LOAD LESSON
// ═══════════════════════════
function loadLesson(bi,li){
  STATE.current={b:bi,l:li};
  setState(STATE);
  buildSidebar();
  closeSidebar();
  const book=CURRICULUM[bi];
  const lesson=book.lessons[li];
  const isDone=STATE.completed[lesson.id];
  document.getElementById('tb-bc').innerHTML=`<strong>${book.title}</strong> — ${lesson.title}`;
  // Render
  const html=`
    <div class="content">
      <div class="lesson-header">
        <div class="lh-book" style="color:${book.color}">${book.title} · ${book.subtitle}</div>
        <h1 class="lh-title">${lesson.title.replace(/'/g,"'")}</h1>
        <div class="lh-meta">
          <div class="lh-tag">${lesson.tag}</div>
          ${isDone?'<div class="lh-tag" style="color:var(--green);border-color:rgba(26,122,74,.3);">✓ Complété</div>':''}
        </div>
      </div>

      <div class="concept-section">
        <div class="cs-eye">Le concept</div>
        <div style="font-size:16px;font-weight:300;color:var(--ink3);line-height:1.9;">${mdToHtml(lesson.concept)}</div>
      </div>

      <div class="insight">
        <div class="insight-lbl">◈ À retenir</div>
        <p>${lesson.insight.replace(/'/g,"'")}</p>
      </div>

      <div class="exercise">
        <div class="ex-lbl">Exercice de la leçon</div>
        <div class="ex-title">${lesson.exercise.title.replace(/'/g,"'")}</div>
        <div class="ex-body">${lesson.exercise.body.replace(/'/g,"'")}</div>
      </div>

      <div class="journal-wrap">
        <div class="journal-lbl">Journal de pratique</div>
        <textarea class="journal-ta" id="journal-ta" placeholder="${lesson.journal.replace(/'/g,"'")}" rows="5">${STATE['journal_'+lesson.id]||''}</textarea>
        <div style="margin-top:8px;">
          <button class="btn btn-outline" style="font-size:11px;padding:10px 20px;" onclick="saveJournal('${lesson.id}')">Sauvegarder ma réflexion</button>
        </div>
      </div>

      <!-- QUIZ ZONE -->
      <div class="quiz-section" id="quiz-zone">
        <div class="quiz-header">
          <div class="quiz-lbl">Validation — Quiz IA</div>
          <div class="quiz-title">Teste ta compréhension</div>
          <div class="quiz-sub">Réponds à 3 questions pour valider cette notion et débloquer la suivante.</div>
        </div>
        <div id="quiz-inner">
          <div style="text-align:center;padding:20px 0;">
            <button class="btn btn-primary" onclick="startQuiz('${lesson.id}','${escJs(lesson.quizContext)}')">Lancer le quiz →</button>
          </div>
        </div>
      </div>

      <!-- COMPLETION -->
      <div class="completion ${isDone?'show':''}" id="completion-banner">
        <div class="comp-icon">✦</div>
        <div class="comp-title">Notion intégrée</div>
        <p class="comp-sub">Tu as validé cette étape. La suivante t'attend.</p>
        <button class="btn btn-gold" onclick="nextLesson()">Leçon suivante →</button>
      </div>
    </div>
  `;
  document.getElementById('page-content').innerHTML=html;
  window.scrollTo({top:0,behavior:'smooth'});
}

function mdToHtml(text){
  return text
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n\n/g,'</p><p class="body" style="margin-bottom:20px;">')
    .replace(/^(.)/,'<p class="body" style="margin-bottom:20px;">$1')
    +'</p>';
}

function escJs(s){return s.replace(/'/g,"\\'").replace(/\n/g,' ');}

function saveJournal(id){
  const val=document.getElementById('journal-ta')?.value||'';
  STATE['journal_'+id]=val;
  setState(STATE);
  // small feedback
  const btn=event.target;
  btn.textContent='Sauvegardé ✓';
  btn.style.color='var(--green)';
  btn.style.borderColor='var(--green)';
  setTimeout(()=>{btn.textContent='Sauvegarder ma réflexion';btn.style.color='';btn.style.borderColor='';},2000);
}

function nextLesson(){
  const bi=STATE.current.b, li=STATE.current.l;
  const book=CURRICULUM[bi];
  if(li<book.lessons.length-1){loadLesson(bi,li+1);}
  else if(bi<CURRICULUM.length-1){loadLesson(bi+1,0);}
  else{
    document.getElementById('page-content').innerHTML=`
      <div class="welcome">
        <div class="w-icon">✦</div>
        <h1 class="w-title">Programme <em>Complété</em></h1>
        <p class="w-sub">Tu as parcouru les 30 notions des 3 programmes. L'aura n'est plus quelque chose que tu travailles — c'est qui tu es.</p>
        <div class="w-stats">
          <div class="ws-item"><div class="ws-num">30</div><div class="ws-lbl">Notions validées</div></div>
          <div class="ws-item"><div class="ws-num">100%</div><div class="ws-lbl">Complété</div></div>
        </div>
        <button class="btn btn-gold" onclick="loadLesson(0,0)">Recommencer depuis le début →</button>
      </div>`;
  }
}

// ═══════════════════════════
// QUIZ VIA CLAUDE API
// ═══════════════════════════
async function startQuiz(lessonId, context){
  const inner=document.getElementById('quiz-inner');
  inner.innerHTML=`<div class="quiz-loading"><div class="ql-dots"><div class="ql-dot"></div><div class="ql-dot"></div><div class="ql-dot"></div></div><div class="ql-text">L'IA génère ton quiz personnalisé…</div></div>`;
  QUIZ_ANSWERS=[];
  QUIZ_SHOWN=0;
  try{
    const prompt=`Tu es un expert du programme AURA sur le développement personnel, l'aura, le magnétisme et le leadership naturel.

Génère exactement 3 questions de quiz pour valider la compréhension de cette notion.

CONTEXTE DE LA LEÇON :
${context}

RÈGLES STRICTES :
- 3 questions, 4 réponses chacune
- Une seule bonne réponse par question
- Les mauvaises réponses doivent être plausibles (pas évidemment fausses)
- Chaque question teste une dimension différente de la notion
- Court feedback d'explication pour chaque bonne réponse (1-2 phrases max)
- Niveau : intermédiaire, pas trivial

RÉPONDS UNIQUEMENT EN JSON VALIDE, ce format exact, sans markdown :
{"questions":[{"q":"texte de la question","options":["A","B","C","D"],"correct":0,"feedback":"explication courte"}]}

correct = index 0-3 de la bonne réponse.`;

    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,messages:[{role:'user',content:prompt}]})
    });
    const data=await resp.json();
    const raw=data.content?.map(b=>b.text||'').join('')||'';
    const clean=raw.replace(/```json|```/g,'').trim();
    QUIZ_DATA=JSON.parse(clean);
    renderQuizQuestion(lessonId,0);
  } catch(e){
    inner.innerHTML=`<div style="text-align:center;padding:20px;">
      <p style="color:var(--gray);margin-bottom:16px;font-size:14px;">Quiz indisponible. Tu peux marquer cette leçon comme complétée manuellement.</p>
      <button class="btn btn-gold" onclick="markDone('${lessonId}')">Marquer comme complétée →</button>
    </div>`;
  }
}

function renderQuizQuestion(lessonId, qIdx){
  const inner=document.getElementById('quiz-inner');
  const q=QUIZ_DATA.questions[qIdx];
  const total=QUIZ_DATA.questions.length;
  const letters=['A','B','C','D'];
  const selectedAns=QUIZ_ANSWERS[qIdx];
  const answered=selectedAns!==undefined;

  let dotsHtml='<div class="quiz-dots">';
  for(let i=0;i<total;i++){
    const cls=i<QUIZ_ANSWERS.length?'qdot done':i===qIdx?'qdot current':'qdot';
    dotsHtml+=`<div class="${cls}"></div>`;
  }
  dotsHtml+='</div>';

  let optsHtml='';
  q.options.forEach((opt,i)=>{
    let cls='quiz-opt';
    if(answered){
      if(i===q.correct)cls+=' correct';
      else if(i===selectedAns&&i!==q.correct)cls+=' wrong';
    } else if(i===selectedAns){cls+=' selected';}
    optsHtml+=`<button class="${cls}" ${answered?'disabled':''} onclick="selectQuizOpt('${lessonId}',${qIdx},${i})">
      <span class="qo-letter">${letters[i]}</span>
      <span class="qo-text">${opt}</span>
    </button>`;
  });

  const feedbackHtml=answered?`
    <div class="quiz-feedback ${selectedAns===q.correct?'ok':'ko'} show">
      ${selectedAns===q.correct?'✓ Correct — ':'✗ Pas tout à fait — '}${q.feedback}
    </div>`:'';

  const isLast=qIdx===total-1;
  const navHtml=answered?`
    <div class="quiz-nav">
      ${dotsHtml}
      <button class="btn btn-primary" onclick="${isLast?`showQuizResult('${lessonId}')`:`renderQuizQuestion('${lessonId}',${qIdx+1})`}">
        ${isLast?'Voir mon résultat':'Question suivante →'}
      </button>
    </div>`:`<div class="quiz-nav">${dotsHtml}<div></div></div>`;

  inner.innerHTML=`
    <div class="quiz-q-num">Question ${qIdx+1} / ${total}</div>
    <div class="quiz-q-text">${q.q}</div>
    <div class="quiz-options">${optsHtml}</div>
    ${feedbackHtml}
    ${navHtml}
  `;
}

function selectQuizOpt(lessonId,qIdx,optIdx){
  QUIZ_ANSWERS[qIdx]=optIdx;
  renderQuizQuestion(lessonId,qIdx);
}

function showQuizResult(lessonId){
  const inner=document.getElementById('quiz-inner');
  const total=QUIZ_DATA.questions.length;
  const correct=QUIZ_ANSWERS.filter((a,i)=>a===QUIZ_DATA.questions[i].correct).length;
  const pct=Math.round((correct/total)*100);
  const passed=correct>=2; // 2/3 minimum

  let color=passed?'var(--green)':'var(--red)';
  let msg=passed
    ?'Tu as démontré une bonne compréhension de cette notion. La prochaine étape t\'attend.'
    :'Quelques points méritent une relecture. Reprends le concept et retente le quiz.';

  inner.innerHTML=`
    <div class="quiz-result">
      <div class="qr-score" style="color:${color}">${correct}/${total}</div>
      <div class="qr-label">${pct}% de bonnes réponses</div>
      <p class="qr-msg">${msg}</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        ${passed
          ?`<button class="btn btn-gold" onclick="markDone('${lessonId}')">Valider cette étape →</button>`
          :`<button class="btn btn-outline" onclick="startQuiz('${lessonId}','${escJs(QUIZ_DATA._ctx||'')}')">Recommencer le quiz</button>`
        }
      </div>
    </div>`;

  if(passed) markDone(lessonId, true);
}

function markDone(lessonId, fromQuiz=false){
  STATE.completed[lessonId]=true;
  setState(STATE);
  buildSidebar();
  if(!fromQuiz){
    const banner=document.getElementById('completion-banner');
    if(banner){banner.classList.add('show');}
  } else {
    const banner=document.getElementById('completion-banner');
    if(banner){banner.classList.add('show');}
    const quizZone=document.getElementById('quiz-zone');
    if(quizZone) quizZone.style.display='none';
  }
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

// ═══════════════════════════
// SIDEBAR MOBILE
// ═══════════════════════════
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ═══════════════════════════
// BOOT
// ═══════════════════════════
buildSidebar();
</script>

</html>
